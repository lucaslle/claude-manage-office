name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package the application
        run: |
          mkdir -p package
          cp -r dist server shared hooks scripts .claude package.json package-lock.json README.md .env.example lancer.cmd lancer.sh package/
          (cd package && zip -qr "../claude-manage-office-${GITHUB_REF_NAME}.zip" .)
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "claude-manage-office-${GITHUB_REF_NAME}.zip" --title "$GITHUB_REF_NAME" --generate-notes
